[package]
name = "tonedial"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
speakrs = { version = "0.7", default-features = false, features = ["cpu"] }
sherpa-onnx = { version = "2.0.1", optional = true }

[features]
sherpa = ["dep:sherpa-onnx"]

[dev-dependencies]
tempfile = "3"
