[package]
name = "tonedial"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
speakrs = { version = "0.7", default-features = false, features = ["cpu"] }
sherpa-onnx = { version = "2.0.1", optional = true }
whisper-rs = { version = "0.16", features = ["vulkan"] }
ureq = "2"
libc = "0.2.191"
whisper-rs-sys = "0.15"
eframe = "0.37.0"
rfd = "0.17.2"
open = "5.4.5"
egui = "0.37"

[features]
sherpa = ["dep:sherpa-onnx"]

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12.0"
